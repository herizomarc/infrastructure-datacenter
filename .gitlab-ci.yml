# .gitlab-ci.yml
# Phase 1 : Provisioning Matériel Pur via OpenTofu & Cloudflare R2 (Sans SSH Proxmox)

stages:
  - validate
  - plan
  - apply
  - destroy

# Utilisation de l'image officielle et immuable d'OpenTofu
image:
  name: ghcr.io/opentofu/opentofu:1.8.2
  entrypoint: [""]

# Cache d'infrastructure pour accélérer l'initialisation du provider Proxmox
cache:
  key: opentofu-infrastructure-cache-v2
  paths:
    - opentofu/.terraform/
    - opentofu/.terraform.lock.hcl

# Commandes exécutées automatiquement au début de chaque job
before_script:
  - cd opentofu/
  - tofu init

# 1. ÉTAPE DE VALIDATION SYNTAXIQUE (ZÉRO ERREUR)
tofu_validate:
  stage: validate
  script:
    - tofu validate

# 2. ÉTAPE DE SIMULATION DRY-RUN (VÉRIFICATION DES ACTIONS)
tofu_plan:
  stage: plan
  script:
    - tofu plan -out=tfplan
  artifacts:
    name: "plan-${CI_COMMIT_SHA}"
    expire_in: 2 days
    paths:
      - opentofu/tfplan

# 3. ÉTAPE DE DÉPLOIEMENT PHYSIQUE (CLIC HUMAIN OBLIGATOIRE)
tofu_apply:
  stage: apply
  script:
    - tofu apply -auto-approve tfplan
  dependencies:
    - tofu_plan
  when: manual # 🛡️ Règle SecOps : Le déclenchement nécessite une validation humaine dans l'UI

# 4. ÉTAPE DE DÉSTRUCTION PHYSIQUE (CLIC HUMAIN OBLIGATOIRE)
tofu_destroy:
  stage: destroy
  script:
    - cd opentofu/
    - tofu init
    - tofu destroy -auto-approve
  when: manual # 🛡️ Sécurité : Clic manuel obligatoire pour éviter les accidents
