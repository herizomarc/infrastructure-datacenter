---
- name: Déploiement industriel du moteur containerd sur RHEL 9.8
  hosts: k8s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Charger les modules noyau nécessaires pour containerd
      ansible.builtin.copy:
        dest: /etc/modules-load.d/containerd.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Activer les modules noyau immédiatement
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [ 'overlay', 'br_netfilter' ]

    - name: Paramétrer le sysctl pour le routage des conteneurs
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        state: present
        reload: yes
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Installer le package de containerd
      ansible.builtin.dnf:
        name: containerd
        state: present
        update_cache: yes

    - name: Configurer le runtime containerd au standard SystemdCgroup
      ansible.builtin.shell: |
        mkdir -p /etc/containerd
        containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/g' > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Démarrer et activer le service containerd au boot
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: yes
