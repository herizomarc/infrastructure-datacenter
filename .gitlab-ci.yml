# .gitlab-ci.yml
# Version Initiale Corrigée - Provisioning Matériel Pur (Sans collision de dossiers)

stages:
  - validate
  - plan
  - apply
  - destroy

image:
  name: ghcr.io/opentofu/opentofu:1.8.2
  entrypoint: [""]

cache:
  key: opentofu-infrastructure-v2
  paths:
    - opentofu/.terraform/
    - opentofu/.terraform.lock.hcl

# 🏆 CORRECTIF : Le before_script se déplace proprement dans le bon répertoire
before_script:
  - cd opentofu/
  - tofu init

# 1. VALIDE LA SYNTAXE (SANS ERREUR COCHE)
tofu_validate:
  stage: validate
  script:
    - tofu validate

# 2. GÉNÈRE LA SIMULATION DE LA INFRASTRUCTURE
tofu_plan:
  stage: plan
  script:
    - tofu plan -out=tfplan
  artifacts:
    name: "plan-${CI_COMMIT_SHA}"
    expire_in: 2 days
    paths:
      - opentofu/tfplan

# 3. APPLIQUE LA CRÉATION MATÉRIELLE
tofu_apply:
  stage: apply
  script:
    - tofu apply -auto-approve tfplan
  dependencies:
    - tofu_plan
  when: manual

# 🏆 LE STAGE DE NETTOYAGE MANUEL SI BESOIN DE ROLLBACK
tofu_destroy:
  stage: destroy
  script:
    - tofu destroy -auto-approve
  when: manual
